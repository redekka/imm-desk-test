name: Build Immich Desktop Portable (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Install Qt 6 via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall
          aqt install-qt windows desktop 6.6.2 win64_msvc2019_64 --outputdir C:\Qt -m qtmultimedia qtimageformats

      - name: Configure CMake
        shell: pwsh
        run: |
          $qtPath = "C:\Qt\6.6.2\msvc2019_64"
          cmake -B build -S . -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtPath"

      - name: Build C++ Executable
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package Portable Directory (windeployqt)
        shell: pwsh
        run: |
          $qtBin = "C:\Qt\6.6.2\msvc2019_64\bin"
          $exe = Get-ChildItem -Path build -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "*test*" } | Select-Object -First 1
          if (-not $exe) { throw "Executable not found!" }
          
          Write-Host "Target executable found at: $($exe.FullName)"
          
          & "$qtBin\windeployqt.exe" --release --no-translations --compiler-runtime "$($exe.FullName)"

          New-Item -ItemType Directory -Force -Path dist/Immich-Desktop-Portable
          Copy-Item -Path "$($exe.DirectoryName)\*" -Destination dist/Immich-Desktop-Portable -Recurse

      - name: Upload Finished Portable App
        uses: actions/upload-artifact@v4
        with:
          name: Immich-Desktop-Windows-Portable
          path: dist/Immich-Desktop-Portable/
